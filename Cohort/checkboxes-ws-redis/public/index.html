<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>CHECKBOXES</h1>
    <p class="subtitle">Interactive Checkbox Grid with Real-time Sync</p>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const CHECKBOXES_SIZE = 100


        //io.emit() server emitted to all so we have to handle in frontend and update
        socket.on('client:checkbox-change',(data)=>{
            //lets update
            const {index,checked} = data
            const input = document.getElementById(`checkbox-${index}`)
            if(input){
                input.checked = checked
            }
        })

        new Array(CHECKBOXES_SIZE).fill(null).forEach((_,index)=>{
            const checkbox = document.createElement('input')
            checkbox.type = 'checkbox'
            checkbox.id = `checkbox-${index}`

            //also we will add eventlistener on this 
            checkbox.addEventListener('change',(event)=>{
                const checked = event.target.checked
                console.log(`Checkbox change:`,{index,checked})
                //so when ever checkbox is checked 
                //from frontend we will send that this checkbox is checked
                socket.emit('client:checkbox-change',{index,checked})
            })


            document.getElementById('container').appendChild(checkbox)
        })
    </script>
</body>
</html>
